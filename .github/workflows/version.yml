name: Version packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  version:
    name: Create version PR
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Create GitHub App token
        id: changesets-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.changesets-token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.changesets-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh pr merge changeset-release/main --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.changesets-token.outputs.token }}
